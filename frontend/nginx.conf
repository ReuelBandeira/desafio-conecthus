server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively — their filenames change on
    # every rebuild, so a stale cache is never actually stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path (client-side route) resolves to
    # index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
