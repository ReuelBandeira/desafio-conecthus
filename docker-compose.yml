services:
  db:
    image: mysql:5.7
    container_name: conecthus-user-api-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conecthus_user
      TZ: America/Manaus
    ports:
      - '3307:3306'
    volumes:
      - ./backend/dados_mysql:/var/lib/mysql
    restart: always
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conecthus-user-api
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: conecthus_user
      PORT: 4050
      BACKEND_PORT: 4050
    ports:
      - '5000:4050'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time (Vite), used by the *browser*, so it has
        # to be a host-reachable URL, not the internal container network.
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: conecthus-user-web
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - api

networks:
  default:
    driver: bridge
